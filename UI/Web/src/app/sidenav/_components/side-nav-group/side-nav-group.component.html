@if (!railMode()) {
  <div class="group-header" role="button" tabindex="0"
       [attr.aria-expanded]="open()" [attr.aria-controls]="bodyId"
       (click)="toggle()" (keydown.enter)="toggle()" (keydown.space)="toggle()">
    <span class="group-label">{{ label() }}</span>
    @if (count() !== null) {
      <span class="group-count">{{ count() }}</span>
    }
    <span class="group-chevron"><i class="fa fa-chevron-down" aria-hidden="true"></i></span>
  </div>
}
<div class="group-body" [id]="bodyId">
  <div class="group-body-inner">
    <div class="group-content">
      <ng-content />
    </div>
  </div>
</div>
